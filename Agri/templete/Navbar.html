{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriMitra</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="shortcut icon" href="{% static 'images/logo.png' %}" type="image/x-icon">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="{% static 'style.css' %}">
<script src="{% static 'script.js' %}"></script>
<script src="https://kit.fontawesome.com/7ce8200eeb.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

</head>

<body>


 <div class="container-fluid p-0">
     <nav class="navbar navbar-expand-lg sticky-top modern-navbar py-3">
         <div class="container">
             <a class="navbar-brand d-flex align-items-center" href="/">
                 <div class="logo-wrapper me-2">
                     <img src="{% static 'images/logo.png' %}" height="40" width="40" class="navbar-img-logo rounded-3" alt="AgriMitra Logo">
                 </div>
                 <span class="brand-text">AgriMitra<span class="dot">.</span></span>
             </a>

             <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                 <span class="navbar-toggler-icon"></span>
             </button>

             <div class="collapse navbar-collapse" id="mainNav">
                 <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                     <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
                     <li class="nav-item"><a class="nav-link" href="/equipment">Browse</a></li>
                     <li class="nav-item"><a class="nav-link" href="/customer-orders">My Orders</a></li>
                     <li class="nav-item"><a class="nav-link" href="/owner-requests">Client Requests</a></li>
                     <li class="nav-item"><a class="nav-link" href="/My-equipment">Inventory</a></li>
                     <li class="nav-item"><a class="nav-link" href="/your-performerce">Profile</a></li>
                 </ul>

                 <div class="d-flex align-items-center nav-auth">
                     {% if obj.user_id == -1 %}
                         <a href="/login" class="btn btn-login-modern d-flex align-items-center gap-2">
                             <span>Login</span>
                             <i class="fa-solid fa-arrow-right-to-bracket"></i>
                         </a>
                     {% else %}
                         <a href="/logout" class="btn btn-logout-modern d-flex align-items-center gap-2">
                             <span>Logout</span>
                             <i class="fa-solid fa-power-off"></i>
                         </a>
                     {% endif %}
                 </div>
             </div>
         </div>
     </nav>
 </div>
