{% include 'Navbar.html' %}
<div class="nav-underline"></div>

{% load static %}
{% block content %}
<div class="auth-viewport">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-5">
                <div class="auth-card border-0 shadow-medium">
                    <div class="auth-card-accent"></div>
                    
                    <div class="auth-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <img src="{% static 'images/logo.png' %}" height="55" width="55" class="auth-logo mb-3 rounded-3" alt="logo">
                            <h3 class="fw-extrabold text-dark mb-1">Welcome Back</h3>
                            <p class="text-muted small">Access your account to manage rentals</p>
                        </div>

                        {% if error %}
                            <div class="alert alert-danger-soft text-center mb-4 d-flex align-items-center justify-content-center gap-2" role="alert">
                                <i class="bi bi-exclamation-triangle-fill"></i> <span>{{ error }}</span>
                            </div>
                        {% endif %}

                        <form action="" method="post" class="modern-form">
                            {% csrf_token %}
                            
                            <div class="form-wrapper">
                                {{ obj.form.as_p }}
                            </div>

                            <button type="submit" class="btn btn-primary-green w-100 mt-4 py-2.5 rounded-3 d-flex align-items-center justify-content-center gap-2">
                                <span>Sign In</span> <i class="bi bi-arrow-right"></i>
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-2">
                            <p class="text-muted small mb-0">
                                Don't have an account? 
                                <a href="/sign-up" class="text-emerald fw-bold text-decoration-none">Create Account</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% include 'footer.html' %}
